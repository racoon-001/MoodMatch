name: MoodMatch CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript files
        run: |
          node --check script.js
          node --check api/details.js
          node --check api/mood.js
          node --check api/movies.js
          node --check api/supabase.js
          node --check api/tmdb.js